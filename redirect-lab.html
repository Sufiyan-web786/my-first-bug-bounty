<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>F - Open Redirect Lab</title>
<style>body{background:#000;color:#0f0;font-family:monospace;text-align:center;padding:20px}</style>
</head>
<body>
<h1>F - Open Redirect Lab</h1>
<p>URL me ?next= lagake hack hota hai</p>
<a href="?next=https://google.com">Click: /redirect-lab.html?next=https://google.com</a>
<br><br>
<a href="?next=https://evil.com">Attack: ?next=https://evil.com</a>
<p id="out"></p>
<script>
let p = new URLSearchParams(window.location.search).get('next');
if(p){ document.getElementById('out').innerHTML = "<h2>Redirecting to: " + p + "</h2><p>Bug Found! Attacker evil.com pe bhej sakta hai!</p>" }
</script>
<p><a href="index.html" style="color:#0ff">Back Home</a></p>
</body>
</html>
